// ---------------------------------------------------------------------------
// ANTI-CHEAT ENGINE
// ---------------------------------------------------------------------------
const MAX_HUMAN_SPEED_MS = 10.5;
const MAX_GPS_JUMP_MS = 12.0;

function haversine(a,b){
  const R=6371000, toRad=d=>d*Math.PI/180;
  const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
function validateActivity({points,avgHr,distance_m,duration_s}){
  if(points.length<3) return {ok:false, reason:"Muy pocos puntos de GPS para validar (¿la grabación fue muy corta?)"};
  for(let i=1;i<points.length;i++){
    const dt=points[i].t-points[i-1].t;
    if(dt<=0) continue;
    const speed=haversine(points[i-1],points[i])/dt;
    if(speed>MAX_GPS_JUMP_MS) return {ok:false, reason:`Salto de GPS sospechoso (${speed.toFixed(1)} m/s entre dos puntos)`};
  }
  const avgSpeed=distance_m/duration_s;
  if(avgSpeed>MAX_HUMAN_SPEED_MS) return {ok:false, reason:`Velocidad promedio imposible (${(avgSpeed*3.6).toFixed(1)} km/h)`};
  if(distance_m<50) return {ok:false, reason:"Distancia muy corta (menos de 50m) — camina o corre un poco más antes de detener la grabación"};
  return {ok:true, reason:null};
}

// ---------------------------------------------------------------------------
// GPS REAL DEL TELÉFONO — reemplaza la simulación. Usa la Geolocation API del
// navegador (no depende de Cubitt ni de ninguna banda: funciona con el chip
// GPS del propio teléfono). Requiere HTTPS, que Render ya provee.
// ---------------------------------------------------------------------------
const TARGET_DISTANCE_M = 5000; // meta del reto de Nivel Bronce: 5 km
let liveRecording = null; // { watchId, points, startTime, reachedTarget }

function startRealRecording(){
  if(!("geolocation" in navigator)){
    toast("Este navegador no soporta GPS. Prueba con Chrome actualizado.");
    return;
  }
  const points = [];
  const startTime = Date.now();
  const watchId = navigator.geolocation.watchPosition(
    (pos) => {
      points.push({
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        t: (Date.now() - startTime) / 1000,
        accuracy: pos.coords.accuracy,
      });
      updateLiveRecordingUI(points, startTime);
    },
    (err) => {
      toast("Error de GPS: " + (err.message || "sin permiso o sin señal") + ". Revisa que el permiso de ubicación esté activo.");
    },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
  );
  liveRecording = { watchId, points, startTime, reachedTarget: false };
  render();
}

function updateLiveRecordingUI(points, startTime){
  const distEl = document.getElementById("liveDistance");
  const timeEl = document.getElementById("liveTime");
  const ptsEl = document.getElementById("livePoints");
  const fillEl = document.getElementById("liveProgressFill");
  const pctEl = document.getElementById("liveProgressPct");
  const remEl = document.getElementById("liveRemaining");
  if(!distEl) return; // pantalla ya no está montada
  let dist = 0;
  for(let i=1;i<points.length;i++) dist += haversine(points[i-1], points[i]);

  distEl.textContent = (dist/1000).toFixed(2) + " km";
  timeEl.textContent = Math.floor((Date.now()-startTime)/1000) + "s";
  ptsEl.textContent = points.length + " puntos GPS";

  const pct = Math.min(100, (dist/TARGET_DISTANCE_M)*100);
  if(fillEl) fillEl.style.width = pct + "%";
  if(pctEl) pctEl.textContent = Math.round(pct) + "%";
  if(remEl){
    const remaining = Math.max(0, TARGET_DISTANCE_M - dist);
    remEl.textContent = remaining > 0 ? `Faltan ${(remaining/1000).toFixed(2)} km para los 5K` : "¡Meta de 5K completada!";
  }

  if(liveRecording && dist>=TARGET_DISTANCE_M && !liveRecording.reachedTarget){
    liveRecording.reachedTarget = true;
    if("vibrate" in navigator) navigator.vibrate([200,100,200]);
    toast("¡Llegaste a los 5 km! Puedes seguir corriendo o detener y guardar ya.");
  }
}

async function stopRealRecordingAndSave(){
  if(!liveRecording){ return; }
  navigator.geolocation.clearWatch(liveRecording.watchId);
  const { points, startTime } = liveRecording;
  liveRecording = null;

  if(points.length < 3){
    toast("Muy pocos puntos GPS capturados — intenta grabar durante más tiempo.");
    render();
    return;
  }

  let distance_m = 0;
  for(let i=1;i<points.length;i++) distance_m += haversine(points[i-1], points[i]);
  const duration_s = points[points.length-1].t;
  const manualHrInput = document.getElementById("manualHrInput");
  const avgHr = manualHrInput && manualHrInput.value ? Number(manualHrInput.value) : null;

  const world = WORLDS.find(w=>w.id===state.selectedWorldId);
  const result = validateActivity({points, avgHr, distance_m, duration_s});
  const record = {
    id:`${world.id}-${Date.now()}`, worldId:world.id, level:"bronce",
    distanceM:Math.round(distance_m), durationS:Math.round(duration_s), avgHr,
    validated:result.ok, rejectReason:result.reason, createdAt:Date.now(), realGps:true,
  };
  state.activities=[record, ...state.activities].slice(0,25); saveActivities();
  if(result.ok){
    state.profile.credits+=50;
    state.profile.bronceCompleted[world.id]=true;
    saveProfile();
  }
  state.lastRecordResult=record; state.recordingOpen=false; render();
  if(!result.ok) toast("Actividad rechazada por el anti-cheat: " + result.reason);
  else toast("¡Carrera real guardada! +50 créditos.");
}

// ---------------------------------------------------------------------------
// MOTOR 3D DE LA RUTA (Three.js) — un corredor de verdad, con su ghost visible
// ---------------------------------------------------------------------------
let raceScene = null;

const WORLD_3D = {
  atacama: { ground:"#3a2a17", sky:"#1a130b", amp:0.35, freq:0.55, decor:"cone", decorColor:"#B97A3A", decorCount:7 },
  alpes:   { ground:"#1c2933", sky:"#0c1318", amp:1.3,  freq:0.9,  decor:"cone", decorColor:"#DDEAF0", decorCount:8 },
  amazonas:{ ground:"#122417", sky:"#0a150d", amp:0.45, freq:1.2,  decor:"cylinder", decorColor:"#2F6B3C", decorCount:10 },
};

function buildWorldCurve(world){
  const pts=[];
  const cfg=WORLD_3D[world.id];
  for(let i=0;i<12;i++){
    const x = -7 + (14*i/11);
    const y = Math.max(0, cfg.amp*Math.sin(x*cfg.freq) + cfg.amp*0.4);
    const z = 0.4*Math.sin(x*0.5);
    pts.push(new THREE.Vector3(x,y,z));
  }
  return new THREE.CatmullRomCurve3(pts);
}

function makeRunner(bodyColor, shoeColor, isGhost){
  const group = new THREE.Group();
  const opac = isGhost ? 0.55 : 1;
  const bodyMat = new THREE.MeshStandardMaterial({ color:bodyColor, transparent:isGhost, opacity:opac });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.2,0.55,8), bodyMat);
  body.position.y = 0.5;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.15,10,10), bodyMat);
  head.position.y = 0.92;
  const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.1,0.3), new THREE.MeshStandardMaterial({ color:shoeColor, transparent:isGhost, opacity:opac }));
  shoe.position.y = 0.12;
  group.add(body,head,shoe);
  return group;
}

function disposeRaceScene(){
  if(!raceScene) return;
  try{
    raceScene.scene.traverse(o=>{
      if(o.geometry) o.geometry.dispose();
      if(o.material) o.material.dispose();
    });
    raceScene.renderer.dispose();
  }catch(e){}
  raceScene=null;
}

function initRaceScene(world, profile){
  disposeRaceScene();
  const canvasEl = document.getElementById("raceCanvas");
  if(!canvasEl || typeof THREE==="undefined") return;
  const cfg = WORLD_3D[world.id];
  const w = canvasEl.width, h = canvasEl.height;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(cfg.sky);

  const camera = new THREE.PerspectiveCamera(42, w/h, 0.1, 100);
  camera.position.set(0, 4.5, 11);
  camera.lookAt(0, 0.6, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  const dir = new THREE.DirectionalLight(0xffffff, 0.9);
  dir.position.set(5,8,5);
  scene.add(dir);

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(24,8), new THREE.MeshStandardMaterial({ color: cfg.ground }));
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -0.02;
  scene.add(ground);

  const curve = buildWorldCurve(world);
  const trackGeo = new THREE.TubeGeometry(curve, 40, 0.55, 6, false);
  const track = new THREE.Mesh(trackGeo, new THREE.MeshStandardMaterial({ color: world.color, opacity:0.35, transparent:true }));
  scene.add(track);

  for(let i=0;i<cfg.decorCount;i++){
    const t = (i+0.5)/cfg.decorCount;
    const p = curve.getPointAt(t);
    const side = i%2===0 ? 1 : -1;
    let mesh;
    if(cfg.decor==="cone"){
      mesh = new THREE.Mesh(new THREE.ConeGeometry(0.25+Math.random()*0.2, 0.8+Math.random()*0.6, 6), new THREE.MeshStandardMaterial({ color: cfg.decorColor }));
    } else {
      mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.9+Math.random()*0.5,6), new THREE.MeshStandardMaterial({ color: cfg.decorColor }));
    }
    mesh.position.set(p.x + side*(1.1+Math.random()*0.6), p.y + 0.3, p.z + side*0.3);
    scene.add(mesh);
  }

  const shoeId = (profile.equippedShoe && profile.equippedShoe[world.id]) || SHOES[world.id][0].id;
  const shoe = SHOES[world.id].find(s=>s.id===shoeId) || SHOES[world.id][0];

  const userMesh = makeRunner(T.gold, shoe.color, false);
  const ghostMesh = makeRunner(T.signal, T.signal, true);
  scene.add(userMesh, ghostMesh);

  const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias:true, alpha:false });
  renderer.setSize(w,h,false);

  raceScene = { renderer, scene, camera, curve, userMesh, ghostMesh };
  updateRacePositions(0,0);
}

function updateRacePositions(userPct, ghostPct){
  if(!raceScene) return;
  const ut = Math.min(0.999, Math.max(0, userPct/100));
  const gt = Math.min(0.999, Math.max(0, ghostPct/100));
  const up = raceScene.curve.getPointAt(ut);
  const gp = raceScene.curve.getPointAt(gt);
  raceScene.userMesh.position.set(up.x, up.y, up.z + 0.4);
  raceScene.ghostMesh.position.set(gp.x, gp.y, gp.z - 0.4);
  raceScene.renderer.render(raceScene.scene, raceScene.camera);
}

function startRace(ghostId){
  const world = WORLDS.find(w=>w.id===state.selectedWorldId);
  const ghost = GHOSTS[world.id].find(g=>g.id===ghostId);
  if(!state.profile.device.gps){
    toast("Vincula tu GPS real en tu Perfil antes de competir."); return;
  }
  if(!state.profile.bronceCompleted[world.id]){
    toast("Completa y valida una actividad de Nivel Bronce en este mundo primero."); return;
  }
  state.selectedGhostId=ghostId;
  state.screen="ghost";
  state.race={status:"running",progress:0,ghostProgress:0,userTime:null,checkpoints:[]};
  render();
  initRaceScene(world, state.profile);

  const userPaceFactor = 0.85+Math.random()*0.3;
  let t=0; const hit=new Set();
  clearInterval(raceTimer);
  raceTimer=setInterval(()=>{
    t+=1;
    const ghostProgress=Math.min(100,(t/ghost.time)*100);
    const userProgress=Math.min(100,(t/(ghost.time*userPaceFactor))*100);

    // Actualiza SOLO los nodos necesarios (barras + escena 3D) — no reconstruye el DOM.
    const ubf=document.getElementById("userBarFill"), ubp=document.getElementById("userBarPct");
    const gbf=document.getElementById("ghostBarFill"), gbp=document.getElementById("ghostBarPct");
    if(ubf) ubf.style.width=userProgress+"%";
    if(ubp) ubp.textContent=Math.round(userProgress)+"%";
    if(gbf) gbf.style.width=ghostProgress+"%";
    if(gbp) gbp.textContent=Math.round(ghostProgress)+"%";
    updateRacePositions(userProgress, ghostProgress);

    ghost.splits.forEach(s=>{
      if(t>=s.time_s && !hit.has(s.km)){
        hit.add(s.km);
        const userSplit=Math.round(s.time_s*userPaceFactor);
        const delta=userSplit-s.time_s;
        state.race.checkpoints.push({km:s.km, ghostSplit:s.time_s, userSplit, delta});
        const wrap=document.getElementById("checkpointsWrap");
        if(wrap){
          const row=document.createElement("div");
          row.className="f-mono";
          row.style.cssText=`display:flex;justify-content:space-between;font-size:11px;padding:6px 12px;border-radius:6px;background:${T.panel2};margin-top:6px;`;
          row.innerHTML=`<span style="color:${T.muted}">Km ${s.km}</span><span>Ghost ${s.time_s}s · Tú ${userSplit}s</span><span style="color:${delta<=0?T.amazonas:T.signal}">${delta<=0?`-${Math.abs(delta)}s`:`+${delta}s`}</span>`;
          wrap.appendChild(row);
        }
      }
    });

    if(userProgress>=100 || ghostProgress>=100){
      clearInterval(raceTimer);
      finishRace(world, ghost, userPaceFactor);
    }
  },90);
}

function finishRace(world, ghost, userPaceFactor){
  const userTime=Math.round(ghost.time*userPaceFactor);
  const won = userTime<=ghost.time;
  state.race={...state.race, status: won?"won":"lost", progress:100, ghostProgress:100, userTime};
  if(won){
    if(!state.profile.badges.includes(ghost.badge)) state.profile.badges.push(ghost.badge);
    state.profile.credits+=150;
    saveProfile();
    submitToLeaderboard(world,ghost,userTime);
  }
  render();
  initRaceScene(world, state.profile);
  updateRacePositions(100,100);
}

async function submitToLeaderboard(world,ghost,timeS){
  const entry = {username:state.profile.username, world:world.name, ghost:ghost.name, timeS, date:Date.now()};
  if(BACKEND_ONLINE){
    const res = await apiPost("/api/leaderboard", entry);
    if(res && res.ok){ toast("Tu tiempo se publicó en el Ranking Global (servidor real)."); return; }
  }
  const list = loadJSON(LEADERBOARD_KEY, []);
  const next = [...list, entry].sort((a,b)=>a.timeS-b.timeS).slice(0,30);
  saveJSON(LEADERBOARD_KEY, next);
  toast(BACKEND_ONLINE ? "No se pudo publicar en el servidor, guardado localmente." : "Guardado en tu Ranking local (backend no conectado).");
}

            <p class="f-mono" style="font-size:10px;color:${T.muted};margin-top:6px;" id="liveRemaining">Faltan 5.00 km para los 5K</p>
          </div>
          <div style="margin-top:10px;">
            <label class="f-mono" style="font-size:10px;color:${T.muted};">FC manual (opcional): </label>
            <input type="text" id="manualHrInput" placeholder="ej. 145" style="width:70px;display:inline-block;margin-left:6px;" />
          </div>
          <button class="btn-gold" style="width:100%;margin-top:12px;" onclick="stopRealRecordingAndSave()">DETENER Y GUARDAR</button>
        </div>` : ""}

      ${lr ? `
        <div class="card" style="margin-top:12px;background:${lr.validated?T.amazonas+"14":T.signal+"14"};border-color:${lr.validated?T.amazonas+"44":T.signal+"44"};">
          <div class="f-display" style="font-size:15px;display:flex;gap:8px;align-items:center;">
            ${lr.validated?icon("check",{color:T.amazonas}):icon("x",{color:T.signal})}${lr.validated?"Actividad real validada":"Actividad rechazada"}
          </div>
          <p class="f-mono" style="font-size:12px;color:${T.muted};margin-top:4px;">${(lr.distanceM/1000).toFixed(2)} km · ${lr.durationS}s ${lr.avgHr?`· FC ${lr.avgHr}`:""}</p>
          ${!lr.validated ? `<p style="font-size:12px;color:${T.signal};margin-top:4px;">${lr.rejectReason}</p>` : `<p style="font-size:12px;color:${T.amazonas};margin-top:4px;">+50 créditos</p>`}
          <button onclick="toggleRecording(false)" class="f-mono" style="background:none;border:none;color:${T.bone};text-decoration:underline;font-size:10px;margin-top:6px;padding:0;">Cerrar</button>
        </div>` : ""}
    </section>

    <section class="card" style="margin-top:16px;opacity:${bronceDone?1:0.5};">
      <div style="display:flex;align-items:center;gap:8px;">${icon("flag",{color:T.signal})}<h3 class="f-display" style="font-size:18px;">Nivel Élite — Extremo</h3></div>
      <p style="font-size:12px;color:${T.muted};margin-top:4px;">Sprints de alta intensidad. Puntos extra por clima real detectado.</p>
      ${!bronceDone ? `<p class="f-mono" style="font-size:10px;color:${T.signal};margin-top:8px;display:flex;gap:4px;align-items:center;">${icon("lock",{size:11,color:T.signal})}Completa y valida Nivel Bronce primero</p>` : ""}
    </section>

    <section style="margin-top:16px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">${icon("radio",{color:world.color})}<h3 class="f-display" style="font-size:18px;">Ghost Mode</h3></div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        ${GHOSTS[world.id].map(g=>{
          const earned=p.badges.includes(g.badge);
          return `<div class="card" style="background:${T.panel2};">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
              <div><p style="font-size:14px;font-weight:600;">${g.name}</p><p class="f-mono" style="font-size:12px;color:${T.muted};margin-top:4px;">Tiempo objetivo: ${fmtTime(g.time)}</p></div>
              ${earned ? icon("award",{color:T.gold,size:18}) : ""}
            </div>
            <button onclick="startRace('${g.id}')" style="width:100%;margin-top:12px;padding:8px;border-radius:10px;background:${T.void};color:${world.color};border:1px solid ${world.color};font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:14px;display:flex;justify-content:center;gap:8px;align-items:center;">
              ${icon("play",{size:14,color:world.color})}COMPETIR CONTRA ESTE GHOST
            </button>
          </div>`;
        }).join("")}
      </div>
    </section>
  </div>`;
}

function shoePickerHtml(world, profile){
  const equipped = profile.equippedShoe[world.id] || SHOES[world.id][0].id;
  return `<section class="card" style="margin-top:20px;">
    <h3 class="f-display" style="font-size:18px;">Calzado para esta ruta</h3>
    <p style="font-size:12px;color:${T.muted};margin-top:4px;">Se ve reflejado en tu avatar durante el Ghost Mode 3D.</p>
    <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;">
      ${SHOES[world.id].map(s=>`
        <button onclick="equipShoe('${world.id}','${s.id}')" style="display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:20px;font-size:12px;background:${equipped===s.id?s.color+"22":T.panel2};border:1px solid ${equipped===s.id?s.color:T.line};color:${T.bone};">
          <span style="width:10px;height:10px;border-radius:50%;background:${s.color};display:inline-block;"></span>${s.name}${equipped===s.id?icon("check",{size:12,color:s.color}):""}
        </button>`).join("")}
    </div>
  </section>`;
}

function renderGhost(){
  const world = WORLDS.find(w=>w.id===state.selectedWorldId);
  const ghost = GHOSTS[world.id].find(g=>g.id===state.selectedGhostId);
  const r = state.race;
  const shoeId = state.profile.equippedShoe[world.id] || SHOES[world.id][0].id;
  const shoe = SHOES[world.id].find(s=>s.id===shoeId) || SHOES[world.id][0];
  return `
  <div style="padding-top:16px;">
    <button onclick="backFromGhost()" class="f-mono" style="background:none;border:none;color:${T.muted};display:flex;gap:4px;align-items:center;font-size:12px;padding:0;">${icon("chevronLeft",{size:14})}${world.name.toUpperCase()}</button>
    <h2 class="f-display" style="font-size:24px;margin-top:10px;">VS. ${ghost.name}</h2>
    <p class="f-mono" style="font-size:12px;color:${T.muted};margin-top:4px;">GPS + FC activos · Calzado: <span style="color:${shoe.color}">${shoe.name}</span></p>

    <div class="card" style="margin-top:14px;padding:6px;">
      <canvas id="raceCanvas" width="380" height="200" style="width:100%;height:200px;border-radius:8px;display:block;"></canvas>
      <div style="display:flex;justify-content:space-between;padding:6px 6px 0;font-size:10px;" class="f-mono">
        <span style="color:${T.gold}">● Tú</span><span style="color:${T.signal}">● ${ghost.name}</span>
      </div>
    </div>

    <div style="margin-top:16px;display:flex;flex-direction:column;gap:16px;">
      ${raceBarShell("TÚ","userBar",T.gold,r.progress)}
      ${raceBarShell("GHOST","ghostBar",T.signal,r.ghostProgress)}
    </div>

    <div style="margin-top:20px;">
      <p class="f-mono" style="font-size:10px;text-transform:uppercase;color:${T.muted};margin-bottom:8px;">Splits por km</p>
      <div id="checkpointsWrap">${r.checkpoints.map(c=>checkpointRowHtml(c)).join("")}</div>
    </div>

    <p id="raceStatusText" class="f-mono" style="font-size:12px;text-align:center;color:${T.muted};margin-top:20px;${r.status!=="running"?"display:none;":""}">Carrera en curso...</p>

    <div id="raceResult">${(r.status==="won"||r.status==="lost") ? resultCardHtml(r,ghost) : ""}</div>
  </div>`;
}
function raceBarShell(label,idPrefix,color,initial){
  return `<div>
    <div class="f-mono" style="display:flex;justify-content:space-between;font-size:10px;text-transform:uppercase;color:${T.muted};margin-bottom:4px;"><span>${label}</span><span id="${idPrefix}Pct">${Math.round(initial)}%</span></div>
    <div class="bar-track"><div id="${idPrefix}Fill" class="bar-fill" style="width:${initial}%;background:${color};"></div></div>
  </div>`;
}
function checkpointRowHtml(c){
  return `<div class="f-mono" style="display:flex;justify-content:space-between;font-size:11px;padding:6px 12px;border-radius:6px;background:${T.panel2};margin-top:6px;">
    <span style="color:${T.muted}">Km ${c.km}</span><span>Ghost ${c.ghostSplit}s · Tú ${c.userSplit}s</span>
    <span style="color:${c.delta<=0?T.amazonas:T.signal}">${c.delta<=0?`-${Math.abs(c.delta)}s`:`+${c.delta}s`}</span></div>`;
}
function resultCardHtml(r,ghost){
  return `<div class="card" style="margin-top:20px;text-align:center;border-color:${r.status==="won"?T.gold:T.line};">
    ${r.status==="won" ? `
      ${icon("award",{size:32,color:T.gold})}
      <h3 class="f-display" style="font-size:20px;margin-top:8px;">¡SUPERASTE AL GHOST!</h3>
      <p style="font-size:14px;color:${T.muted};margin-top:4px;">Tiempo: ${fmtTime(r.userTime)}</p>
      <div style="margin-top:12px;display:flex;justify-content:center;">${badgeHtml(ghost.badge+" — desbloqueada",T.gold)}</div>
      <p class="f-mono" style="font-size:10px;color:${T.amazonas};margin-top:12px;">+150 créditos · Publicado en tu Ranking</p>
    ` : `
      ${icon("x",{size:32,color:T.signal})}
      <h3 class="f-display" style="font-size:20px;margin-top:8px;">EL GHOST GANÓ ESTA VEZ</h3>
      <p style="font-size:14px;color:${T.muted};margin-top:4px;">Tu tiempo: ${fmtTime(r.userTime)}</p>
    `}
    <button class="btn-gold" style="width:100%;margin-top:16px;" onclick="retryGhost()">REINTENTAR</button>
  </div>`;
}

async function renderLeaderboardScreen(){
  const container = document.getElementById("leaderboardMount");
  if(!container) return;
  let rows, source;
  if(BACKEND_ONLINE){
    const res = await apiGet("/api/leaderboard");
    if(res && res.rows){ rows = res.rows; source = "servidor"; }
  }
  if(!rows){ rows = loadJSON(LEADERBOARD_KEY, []); source = "local"; }
  container.innerHTML = `
    <div class="card" style="margin-top:12px;display:flex;gap:12px;align-items:center;background:${T.gold}14;border-color:${T.gold}44;">
      ${icon("trophy",{size:22,color:T.gold})}
      <p style="font-size:12px;">${source==="servidor" ? "Ranking global real — compartido entre todos los que usan este servidor." : "Backend no conectado: mostrando tu ranking guardado en este navegador."}</p>
    </div>
    ${rows.length===0 ? `<p class="f-mono" style="font-size:12px;color:${T.muted};margin-top:16px;">Aún nadie ha vencido a un Ghost. Sé el primero.</p>` : ""}
    <div style="margin-top:16px;display:flex;flex-direction:column;gap:8px;">
      ${rows.map((r,i)=>`
        <div style="display:flex;justify-content:space-between;align-items:center;border-radius:10px;padding:12px 16px;background:${T.panel};border:1px solid ${T.line};">
          <div style="display:flex;align-items:center;gap:12px;">
            <span class="f-display" style="font-size:18px;width:20px;color:${i<3?T.gold:T.muted};">${i+1}</span>
            <div><p style="font-size:14px;font-weight:600;">${r.username}</p><p class="f-mono" style="font-size:10px;color:${T.muted};">${r.world} · ${r.ghost}</p></div>
          </div>
          <span class="f-mono" style="font-size:14px;">${fmtTime(r.timeS)}</span>
        </div>`).join("")}
    </div>`;
}
function renderLeaderboard(){
  setTimeout(renderLeaderboardScreen, 0);
  return `<div style="padding-top:20px;">
    <h2 class="f-display" style="font-size:30px;">RANKING</h2>
    <div id="leaderboardMount"><p class="f-mono" style="font-size:12px;color:${T.muted};margin-top:16px;">Cargando...</p></div>
  </div>`;
}

function renderMarket(){
  const p=state.profile;
  return `
  <div style="padding-top:20px;">
    <h2 class="f-display" style="font-size:30px;">MARKETPLACE</h2>
    <p style="font-size:14px;color:${T.muted};margin-top:4px;">Tu saldo: <span style="color:${T.gold}">${p.credits} créditos</span></p>
    <div style="margin-top:16px;display:flex;flex-direction:column;gap:12px;">
      ${MARKET_ITEMS.map(item=>`
        <div style="display:flex;justify-content:space-between;align-items:center;border-radius:10px;padding:12px 16px;background:${T.panel};border:1px solid ${T.line};">
          <div><p style="font-size:14px;font-weight:600;">${item.name}</p>
            <p class="f-mono" style="font-size:10px;color:${T.muted};margin-top:2px;">${item.priceCredits>0?`${item.priceCredits} créditos`:"Canje gratis (Pase)"}${item.sponsor?` · patrocina ${item.sponsor}`:""}</p></div>
          <button onclick="redeemItem('${item.id}')" class="f-display" style="background:${T.gold};color:${T.void};border:none;border-radius:8px;padding:8px 12px;font-weight:700;font-size:12px;">CANJEAR</button>
        </div>`).join("")}
    </div>
  </div>`;
}

function renderProfile(){
  const p=state.profile;
  return `
  <div style="padding-top:20px;">
    <h2 class="f-display" style="font-size:30px;">PERFIL</h2>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <input type="text" id="usernameInput" value="${p.username}" style="flex:1;" />
      <button class="btn-outline" onclick="saveUsername()">Guardar</button>
    </div>

    <div class="card" style="margin-top:16px;">
      <p class="f-mono" style="font-size:10px;text-transform:uppercase;color:${T.gold};">Pase de Atleta — Activo</p>
      <p style="font-size:12px;color:${T.muted};margin-top:4px;">$1/mes · ${p.credits} créditos disponibles</p>
      <button onclick="cancelSubscription()" class="f-mono" style="background:none;border:none;color:${T.signal};text-decoration:underline;font-size:11px;margin-top:8px;padding:0;">Cancelar suscripción</button>
    </div>

    <div class="card" style="margin-top:16px;">
      <h3 class="f-display" style="font-size:18px;">Verificación anti-trampas</h3>
      <p style="font-size:12px;color:${T.muted};margin-top:4px;">El GPS real de tu teléfono es obligatorio para grabar y competir. La frecuencia cardíaca queda manual — Cubitt no tiene una API pública para leerla automático.</p>
      ${deviceRow("mapPin","GPS real del teléfono","Permiso del navegador — sin depender de Cubitt",p.device.gps,"gps")}
      ${deviceRow("heart","Frecuencia cardíaca","Manual/opcional — se escribe al guardar cada carrera",p.device.hr,"hr")}
    </div>

    <div class="card" style="margin-top:16px;">
      <h3 class="f-display" style="font-size:18px;">Insignias de Leyenda</h3>
      ${p.badges.length===0 ? `<p style="font-size:12px;color:${T.muted};margin-top:8px;">Aún no has vencido a ningún Ghost.</p>` :
        `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;">${p.badges.map(b=>badgeHtml(b,T.gold)).join("")}</div>`}
    </div>

    <div class="card" style="margin-top:16px;">
      <div style="display:flex;align-items:center;gap:8px;">${icon("history",{color:T.muted})}<h3 class="f-display" style="font-size:18px;">Historial de actividades</h3></div>
      ${state.activities.length===0 ? `<p style="font-size:12px;color:${T.muted};margin-top:8px;">Sin actividades registradas todavía.</p>` : ""}
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:8px;">
        ${state.activities.map(a=>`
          <div class="f-mono" style="display:flex;justify-content:space-between;font-size:11px;padding:8px 12px;border-radius:6px;background:${T.panel2};">
            <span>${a.worldId} · ${(a.distanceM/1000).toFixed(2)}km</span>${a.validated?icon("check",{size:14,color:T.amazonas}):icon("x",{size:14,color:T.signal})}
          </div>`).join("")}
      </div>
    </div>

    <button class="btn-outline" style="width:100%;margin-top:16px;display:flex;justify-content:center;gap:8px;align-items:center;color:${T.muted};" onclick="resetProgress()">${icon("reset",{size:13})}Reiniciar progreso (demo)</button>
  </div>`;
}
function deviceRow(ic,label,detail,linked,kind){
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid ${T.line};">
    <div style="display:flex;align-items:center;gap:12px;">${icon(ic,{color:linked?T.amazonas:T.muted})}<div><p style="font-size:14px;">${label}</p><p class="f-mono" style="font-size:10px;color:${T.muted};">${detail}</p></div></div>
    ${linked ? `<span class="f-mono" style="font-size:10px;color:${T.amazonas};display:flex;gap:4px;align-items:center;">${icon("unlock",{size:12,color:T.amazonas})}Vinculado</span>`
      : `<button onclick="linkDevice('${kind}')" class="f-display" style="background:${T.panel2};color:${T.bone};border:1px solid ${T.line};border-radius:8px;padding:6px 12px;font-weight:700;font-size:12px;">Vincular</button>`}
  </div>`;
}

// ---------------------------------------------------------------------------
// PWA — registro del service worker + botón "Instalar app"
// ---------------------------------------------------------------------------
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  });
}
let deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  state.canInstall = true;
  render();
});
async function installApp() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  state.canInstall = false;
  render();
}
window.addEventListener("appinstalled", () => {
  toast("RunElite instalada. Búscala en tu pantalla de inicio.");
});

init();
</script>
</body>
</html>
